name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci
      - name: Install pinned Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Validate canonical baseline
        run: npm run validate
      - name: Run validator negative fixtures
        run: npm run test:validator
      - name: Run Function, browser, and visual regression tests
        run: npx playwright test
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
